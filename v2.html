                let alturaStr = prompt("Digite a sua altura em metros (ex:1.75):");

                let altura = parseFloat(alturaStr);

                if (!nome || isNaN(peso) || isNaN(altura) <=0) {
                    document.write ("<p style='color:red;'>Dados inválidos inseridos. Por favor, recarregue a página.</p>");

                } else {
                    let imc = peso / (altura*altura);
                    let classificação = "";
                    if(imc < 18.5) {
                        classificacao = "Abaixo do peso ideal";
                    } else if (imc >= 18.5 && imc < 25) {
                        classificacao = "Peso normal (Eutrofia)";
                    } else if (imc >= 25 && imc < 30) {
