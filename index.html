<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef4ff">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    <main class="calculator">
        <p class="eyebrow">Bem-estar</p>
        <h1>Calculadora de IMC</h1>
        <p class="intro">Informe seus dados para descobrir seu Índice de Massa Corporal.</p>

        <form id="imc-form" novalidate>
            <div class="fields">
                <div>
                    <label for="nome">Seu nome <span>(opcional)</span></label>
                    <input type="text" id="nome" name="nome" autocomplete="name" maxlength="80" placeholder="Como podemos chamar você?">
                </div>
                <div>
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" min="1" max="500" step="any" inputmode="decimal" required placeholder="Ex.: 70">
                </div>
                <div>
                    <label for="altura">Altura (m)</label>
                    <input type="number" id="altura" name="altura" min="0.5" max="2.7" step="any" inputmode="decimal" required placeholder="Ex.: 1,75">
                </div>
            </div>
            <button type="submit">Calcular meu IMC</button>
            <p id="erro" class="error" role="alert" aria-live="polite"></p>
        </form>

        <section id="resultado" class="result" aria-live="polite" aria-atomic="true" hidden>
            <p id="saudacao" class="result__greeting"></p>
            <p class="result__value"><span id="valor-imc"></span></p>
            <p id="detalhes" class="result__details"></p>
            <p id="classificacao" class="result__status"></p>
            <img id="figura" class="result__image" alt="">
            <p class="result__note">O IMC é uma referência geral e não substitui a avaliação de um profissional de saúde.</p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
