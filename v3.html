<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Termometro Visual- Procedural com Formulário</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                background-color: #f0f2f5;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;

            }
            .card{
                background: white;
                padding: 30px;
                border-radius: 10px;
                box-shadow: opx 4px 10px rgba(0,0,0,0.1);
                width: 320px;
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                color: #333;
            }
            input {
                width: 100%;
                padding: 8px ;
                box-sizing: border-box;
                border-radius: 4px;
            }
            button{
                width: 100%;
                background-color: #0056b3;
            
                
            }
            .termometro-container {
                width: 100%;
                background-color: #e0e0e0;
                border-radius: 5px;
                height: 25px;
                margin-top: 15px;
                overflow:hidden;
                border: 1px solid #ccc;
            }
            .barra-nivel {
                height: 100%;
                width: 0%;
                transition: width 0.4s ease;
            }
            #saida {
                margin-top: 20px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Conversor de temperatura</h2>
            <!--Formulário HTML simples-->
            <div class="form-group">
                <label for="nome">Seu nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
            </div>
            <div class="form-group">
                <label for="celsius">Temperatura(°C)</label>
                <input type="number" id="celsius" step="0.1" placeholder="Ex: 25">
              
            </div>
        <button onclick="
        // 1. LEITURA DOS DADOS DIRETO DOS INPUTS
        let nome = document.getElementById('nome').value;
        let celsiusStr = document.getElementById('celsius').value;
        let divSaida = document.getElementById('saida');

        // Conversão e Validação básica
        let celsius = parseFloat(celsiusStr);

        if (nome === '' || isNaN(celsius)) {
        divSaida.innerHTML = '<p style=\'color: red;\'>Preencha todos os campos corretamente!</p>';
        } else {
        // 2. PROCESSAMENTO
        let fahrenheit = (celsius * 9 / 5) + 32;
        let corBarra = '';
        let mensagem = '';
        let larguraBarra = 0;

        if (celsius < 15) {
        corBarra = '#3498db'; // Azul (Frio)
        mensagem = 'Clima Frio ❄️';
        larguraBarra = 30;
        } else if (celsius >= 15 && celsius < 30) {
        corBarra = '#2ecc71'; // Verde (Agradável)
        mensagem = 'Clima Agradável ☀️';
        larguraBarra = 60;
         } else {
        corBarra = '#e74c3c'; // Vermelho (Quente)
        mensagem = 'Clima Quente 🔥';
        larguraBarra = 100;
        }

        // 3. SAÍDA DE DADOS USANDO innerHTML
        divSaida.innerHTML = `
        <p>Olá, <strong>${nome}</strong>!</p>
        <p>Celsius: <strong>${celsius.toFixed(1)}°C</strong></p>
        <p>Fahrenheit: <strong>${fahrenheit.toFixed(1)}°F</strong></p>
        <p>Situação: <strong>${mensagem}</strong></p>
                   
        <div class='termometro-container'>
        <div class='barra-nivel' style='width: ${larguraBarra}%; background-color: ${corBarra};'></div>
        </div>
            `;
            }
        ">Converter</button>
        <!-- Área de Saída -->
        <div id="saida"></div>



            
        </div>
    </body>
</html>
